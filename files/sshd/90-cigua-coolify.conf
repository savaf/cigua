# Gestionado por el repo cigua. Solo se instala con COOLIFY=1 (modules/coolify.sh).
# __COOLIFY_USER__ administra el host por SSH con llave, desde su contenedor (red de Docker)
# o desde localhost. Desde cualquier otro origen se le niega. Root sigue prohibido (10-cigua.conf).
# Va el último y con Match al final: nada puede quedar detrás.
# __DOCKER_CIDRS__ sale de docker_cidrs (default-address-pools de Docker): no lo escribas a mano.
Match User __COOLIFY_USER__ Address *,!127.0.0.1,!::1__DOCKER_CIDRS__
    DenyUsers __COOLIFY_USER__

# Gestionado por el repo cigua (files/sshd/10-cigua.conf). Cambios aquí se pisan.
# Prefijo 10-: sshd se queda con el primer valor que lee, así esto gana a 50-cloud-init.conf
# (que en imágenes cloud de Ubuntu reactiva PasswordAuthentication).
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
# Para que herdr --remote y los clientes del teléfono detecten conexiones muertas.
ClientAliveInterval 30
ClientAliveCountMax 4
